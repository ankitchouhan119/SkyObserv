# SkyWalking OAP — AWS EC2 + Aiven OpenSearch
#
# Requires t3.medium (4 GB RAM) for OpenSearch-backed OAP.
# t3.small (2 GB) will OOM on Metaspace — do not use.
#
# Setup:
#   cp .env.example .env
#   docker compose -f docker-compose.aws.yml up -d

services:
  oap:
    image: apache/skywalking-oap-server:10.0.0
    container_name: skywalking-oap
    restart: unless-stopped
    env_file: .env
    environment:
      SW_STORAGE: ${SW_STORAGE:-elasticsearch}
      SW_STORAGE_ES_CLUSTER_NODES: ${OPENSEARCH_HOST}
      SW_STORAGE_ES_HTTP_PROTOCOL: https
      SW_ES_USER: ${OPENSEARCH_USER}
      SW_ES_PASSWORD: ${OPENSEARCH_PASSWORD}
      SW_NAMESPACE: skywalking
      SW_HEALTH_CHECKER: default
      SW_TELEMETRY: none
      SW_CORE_GRPC_THREAD_POOL_SIZE: 2
      SW_CORE_REST_THREAD_POOL_SIZE: 2
      JAVA_OPTS: >-
        -Xms768m -Xmx1536m
        -XX:MaxMetaspaceSize=384m
        -XX:CompressedClassSpaceSize=128m
        -XX:+UseSerialGC
        -XX:TieredStopAtLevel=1
    ports:
      - "11800:11800"
      - "12800:12800"
    mem_limit: 2800m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:12800/graphql || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
