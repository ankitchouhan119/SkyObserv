# SkyWalking OAP — AWS EC2 + Aiven OpenSearch (persistent storage)
#
# Setup on EC2:
#   cp .env.example .env    # fill OpenSearch credentials
#   docker compose -f docker-compose.aws.yml up -d
#
# Requires t3.small (2 GB RAM) minimum.

services:
  oap:
    image: apache/skywalking-oap-server:10.0.0
    container_name: skywalking-oap
    restart: unless-stopped
    env_file: .env
    environment:
      SW_STORAGE: ${SW_STORAGE:-elasticsearch}
      SW_STORAGE_ES_CLUSTER_NODES: ${OPENSEARCH_HOST}
      SW_STORAGE_ES_HTTP_PROTOCOL: https
      SW_ES_USER: ${OPENSEARCH_USER}
      SW_ES_PASSWORD: ${OPENSEARCH_PASSWORD}
      SW_NAMESPACE: skywalking
      SW_HEALTH_CHECKER: default
      SW_TELEMETRY: none
      SW_CORE_GRPC_THREAD_POOL_SIZE: 4
      SW_CORE_REST_THREAD_POOL_SIZE: 4
      JAVA_OPTS: >-
        -Xms512m -Xmx1024m
        -XX:MaxMetaspaceSize=128m
        -XX:+UseSerialGC
    ports:
      - "11800:11800"
      - "12800:12800"
    mem_limit: 1536m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:12800/graphql || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
