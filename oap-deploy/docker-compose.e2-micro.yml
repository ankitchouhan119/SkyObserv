# SkyWalking OAP — Oracle E2.1.Micro (1 GB RAM VM)
# H2 in-memory storage, aggressive JVM tuning
# If OOM: deploy mock-oap instead (see ../mock-oap/)

services:
  oap:
    image: apache/skywalking-oap-server:10.0.0
    container_name: skywalking-oap
    restart: unless-stopped
    environment:
      SW_STORAGE: h2
      SW_HEALTH_CHECKER: default
      SW_TELEMETRY: none
      SW_CORE_GRPC_THREAD_POOL_SIZE: 2
      SW_CORE_REST_THREAD_POOL_SIZE: 2
      JAVA_OPTS: >-
        -Xms128m -Xmx512m
        -XX:MaxMetaspaceSize=128m
        -XX:+UseSerialGC
        -XX:TieredStopAtLevel=1
    ports:
      - "11800:11800"
      - "12800:12800"
    mem_limit: 768m
