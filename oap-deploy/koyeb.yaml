# Koyeb deployment config for SkyWalking OAP
# Deploy via: koyeb.com → New App → Docker → point to this repo, oap-deploy/Dockerfile
name: skywalking-oap
services:
  - name: oap
    type: web
    docker:
      dockerfile: oap-deploy/Dockerfile
    instance_types:
      - nano   # free tier — 0.1 vCPU, 512MB RAM
    ports:
      - port: 12800   # HTTP GraphQL — exposed publicly
        protocol: http
    health_checks:
      - path: /graphql
        port: 12800
    env:
      - key: SW_STORAGE
        value: h2
      - key: JAVA_OPTS
        value: "-Xms64m -Xmx360m -XX:MaxMetaspaceSize=96m -XX:+UseSerialGC"
