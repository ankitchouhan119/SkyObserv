services:

  # ── SkyWalking OAP Server ────────────────────────────────
  - type: web
    name: skywalking-oap
    runtime: docker
    dockerfilePath: ./oap-deploy/Dockerfile
    plan: free
    healthCheckPath: /graphql
    envVars:
      # H2 in-memory storage — no external DB needed for OAP
      - key: SW_STORAGE
        value: h2

      - key: SW_HEALTH_CHECKER
        value: default

      - key: SW_TELEMETRY
        value: none

      - key: SW_CORE_GRPC_THREAD_POOL_SIZE
        value: "4"

      - key: SW_CORE_REST_THREAD_POOL_SIZE
        value: "4"

      # Aggressively tuned to fit within Render's 512MB free tier
      - key: JAVA_OPTS
        value: "-Xms64m -Xmx360m -XX:MaxMetaspaceSize=96m -XX:CompressedClassSpaceSize=32m -XX:+UseSerialGC -XX:TieredStopAtLevel=1"

  # ── SkyObserv App ────────────────────────────────────────
  - type: web
    name: skyobserv
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /config
    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: "5000"

      - key: NODE_TLS_REJECT_UNAUTHORIZED
        value: "0"

      # These are set manually in Render dashboard (secrets)
      - key: DATABASE_URL
        sync: false

      - key: OPENSEARCH_URL
        sync: false

      - key: TAMBO_API_KEY
        sync: false

      # Points to the OAP service above
      - key: SKYWALKING_ENDPOINT
        value: https://skywalking-oap.onrender.com
