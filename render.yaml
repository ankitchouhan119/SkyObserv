services:

  # ── SkyWalking Mock OAP (Node.js — fits in 512MB easily) ─
  - type: web
    name: skywalking-oap
    runtime: docker
    dockerfilePath: ./mock-oap/Dockerfile
    plan: free
    healthCheckPath: /health

  # ── SkyObserv App ────────────────────────────────────────
  - type: web
    name: skyobserv
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /config
    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: "5000"

      - key: NODE_TLS_REJECT_UNAUTHORIZED
        value: "0"

      # These are set manually in Render dashboard (secrets)
      - key: DATABASE_URL
        sync: false

      - key: OPENSEARCH_URL
        sync: false

      - key: TAMBO_API_KEY
        sync: false

      # Points to the OAP service above
      - key: SKYWALKING_ENDPOINT
        value: https://skywalking-oap.onrender.com
