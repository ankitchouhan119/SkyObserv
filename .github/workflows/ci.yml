name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run tests
        run: npm test

      - name: Type check
        run: npm run check || true

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Notify on failure
        if: failure()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          [ -n "$SLACK_WEBHOOK" ] || exit 0
          curl -s -X POST "$SLACK_WEBHOOK" \
            -H 'Content-type: application/json' \
            -d '{"text":"CI failed — PR #${{ github.event.number }} (${{ github.head_ref }})"}'

  scan:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t skyobserv:pr .

      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: skyobserv:pr
          exit-code: 1
          severity: CRITICAL
          ignore-unfixed: true

      - name: Notify on failure
        if: failure()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          [ -n "$SLACK_WEBHOOK" ] || exit 0
          curl -s -X POST "$SLACK_WEBHOOK" \
            -H 'Content-type: application/json' \
            -d '{"text":"Trivy CRITICAL vuln found — PR #${{ github.event.number }}"}'
