name: CD

on:
  push:
    branches: [main]

env:
  # GHCR requires lowercase image names
  IMAGE: ghcr.io/${{ github.repository_owner }}/skyobserv

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

  deploy-staging:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to staging
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            if ! command -v docker &>/dev/null; then
              sudo dnf install -y docker
              sudo systemctl enable --now docker
            fi
            echo "${{ secrets.GHCR_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            sudo docker pull ${{ env.IMAGE }}:${{ github.sha }}
            sudo docker stop skyobserv || true
            sudo docker rm skyobserv || true
            sudo docker run -d \
              --name skyobserv \
              --restart always \
              -p 5000:5000 \
              --env-file /home/ec2-user/skyobserv.env \
              ${{ env.IMAGE }}:${{ github.sha }}

      - name: Notify Slack
        if: always()
        run: |
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK }}" \
            -H 'Content-type: application/json' \
            -d '{"text":"Staging deploy ${{ job.status }} — ${{ github.repository }}@${{ github.sha }}"}'

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            if ! command -v docker &>/dev/null; then
              sudo dnf install -y docker
              sudo systemctl enable --now docker
            fi
            echo "${{ secrets.GHCR_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            sudo docker pull ${{ env.IMAGE }}:${{ github.sha }}
            sudo docker stop skyobserv || true
            sudo docker rm skyobserv || true
            sudo docker run -d \
              --name skyobserv \
              --restart always \
              -p 5000:5000 \
              --env-file /home/ec2-user/skyobserv.env \
              ${{ env.IMAGE }}:${{ github.sha }}

      - name: Notify Slack
        if: always()
        run: |
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK }}" \
            -H 'Content-type: application/json' \
            -d '{"text":"Production deploy ${{ job.status }} — ${{ github.repository }}@${{ github.sha }}"}'
