name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  # GHCR requires lowercase image names
  IMAGE: ghcr.io/${{ github.repository_owner }}/skyobserv

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

  deploy-staging:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to staging
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USER: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ env.IMAGE }}:${{ github.sha }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,IMAGE_TAG
          script: |
            set -e
            if ! command -v docker &>/dev/null; then
              sudo dnf install -y docker
              sudo systemctl enable --now docker
            fi
            if [ -z "$GHCR_TOKEN" ]; then
              echo "GHCR_TOKEN secret missing"
              exit 1
            fi
            printf '%s' "$GHCR_TOKEN" | sudo docker login ghcr.io -u "$GHCR_USER" --password-stdin
            sudo docker system prune -af || true
            sudo docker pull "$IMAGE_TAG"
            sudo docker stop skyobserv 2>/dev/null || true
            sudo docker rm skyobserv 2>/dev/null || true
            sudo docker run -d \
              --name skyobserv \
              --restart always \
              -p 5000:5000 \
              --env-file /home/ec2-user/skyobserv.env \
              "$IMAGE_TAG"

      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          [ -n "$SLACK_WEBHOOK" ] || exit 0
          curl -s -X POST "$SLACK_WEBHOOK" \
            -H 'Content-type: application/json' \
            -d '{"text":"Staging deploy ${{ job.status }} — ${{ github.repository }}@${{ github.sha }}"}'

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to production
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USER: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ env.IMAGE }}:${{ github.sha }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,IMAGE_TAG
          script: |
            set -e
            if ! command -v docker &>/dev/null; then
              sudo dnf install -y docker
              sudo systemctl enable --now docker
            fi
            if [ -z "$GHCR_TOKEN" ]; then
              echo "GHCR_TOKEN secret missing"
              exit 1
            fi
            printf '%s' "$GHCR_TOKEN" | sudo docker login ghcr.io -u "$GHCR_USER" --password-stdin
            sudo docker system prune -af || true
            sudo docker pull "$IMAGE_TAG"
            sudo docker stop skyobserv 2>/dev/null || true
            sudo docker rm skyobserv 2>/dev/null || true
            sudo docker run -d \
              --name skyobserv \
              --restart always \
              -p 5000:5000 \
              --env-file /home/ec2-user/skyobserv.env \
              "$IMAGE_TAG"

      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          [ -n "$SLACK_WEBHOOK" ] || exit 0
          curl -s -X POST "$SLACK_WEBHOOK" \
            -H 'Content-type: application/json' \
            -d '{"text":"Production deploy ${{ job.status }} — ${{ github.repository }}@${{ github.sha }}"}'
